<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INO Explore API</title>
  <link rel="stylesheet" href="swagger-ui.css">
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      dom_id: "#swagger-ui",
      url: "openapi.json",
      deepLinking: true,
      validatorUrl: null,
      docExpansion: "list",
      presets: [SwaggerUIBundle.presets.apis]
    });
  </script>
</body>
</html>
