x-database-url: &database-url "${DATABASE_URL:-postgres://ino:ino_local@postgres:5432/ino?sslmode=disable}"

services:
  api:
    build:
      context: .
      target: api
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: *database-url
      DB_STARTUP_TIMEOUT: "${DB_STARTUP_TIMEOUT:-30s}"
      REDIS_URL: "${REDIS_URL-redis://redis:6379/0}"
      CACHE_REDIS_TIMEOUT: "${CACHE_REDIS_TIMEOUT:-50ms}"
      FEED_CURSOR_SECRET: "${FEED_CURSOR_SECRET:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    stop_grace_period: 15s

  read-projector:
    build:
      context: .
      target: read-projector
    environment:
      DATABASE_URL: *database-url
      DB_STARTUP_TIMEOUT: "${DB_STARTUP_TIMEOUT:-30s}"
      REDIS_URL: "${REDIS_URL-redis://redis:6379/0}"
      CACHE_REDIS_TIMEOUT: "${CACHE_REDIS_TIMEOUT:-50ms}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    stop_grace_period: 15s

  seed:
    build:
      context: .
      target: seed
    environment:
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ino}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ino_local}"
      POSTGRES_DB: "${POSTGRES_DB:-ino}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.10.2-alpine3.23
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
