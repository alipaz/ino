services:
  api:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "${DATABASE_URL:-postgres://ino:ino_local@postgres:5432/ino?sslmode=disable}"
      DB_STARTUP_TIMEOUT: "${DB_STARTUP_TIMEOUT:-30s}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 15s

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ino}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ino_local}"
      POSTGRES_DB: "${POSTGRES_DB:-ino}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.10.2-alpine3.23
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
